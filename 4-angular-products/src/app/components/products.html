<h2>{{title}}</h2>

@if (products.length > 0) {
    <table class="table table-striped table-hover">
        
        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody>
            @for(product of products; track $index){
                <tr>
                    <td>{{product.id}}</td>
                    <td>{{product.name}}</td>
                    <td>{{product.description}}</td>
                    <td>{{product.price}}</td>
                </tr>
            }
        </tbody>
    </table>
} @else {
    <div class="alert alert-danger">
        Lo sentimos, no hay productos disponibles.
    </div>
}
